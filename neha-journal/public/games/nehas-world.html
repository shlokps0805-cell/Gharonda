<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketchbook Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one graph-paper page (the game canvas) on a dark desk; menus are paper cards taped on top of it.
   Single deliberate look (ink + marker on paper), so no light/dark switch. */
:root{
  --desk:#252c38;
  --desk-line:#323b4a;
  --paper:#f6f9fc;
  --paper-shade:#e6eef5;
  --ink:#272235;
  --ink-soft:#5f5a72;
  --yellow:#ffd54f;
  --coral:#f2876a;
  --teal:#5cbfb0;
  --tape:rgba(255,236,170,.78);
  --font-display:'Gaegu','Chalkboard SE','Comic Sans MS',cursive;
  --font-body:'Patrick Hand','Chalkboard SE','Comic Sans MS',cursive;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;box-sizing:border-box;background:var(--desk);color:var(--paper);
  font-family:var(--font-body);font-size:16px;
  padding-inline:16px;padding-block:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background-image:radial-gradient(var(--desk-line) 1px,transparent 1.2px);background-size:22px 22px;
}
.topbar{width:min(100%,1100px);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em;color:var(--paper)}
.topbar h1 span{color:var(--yellow)}
.topbar p{margin:0;color:#b8c2d3;font-size:1rem}
.topbar kbd{font-family:var(--font-body);background:var(--paper);color:var(--ink);border-radius:5px 3px 6px 3px;padding:0 .35em;box-shadow:0 2px 0 #9aa6b8}
.stage{
  position:relative;container-type:inline-size;
  width:min(100%,1100px,calc((100dvh - 110px) * 640 / 448));
  aspect-ratio:640/448;max-width:100%;
  border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 6px var(--paper),0 0 0 7px #c9d4e0;
  background:var(--paper);outline:none;
}
.stage:focus-visible{box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 6px var(--paper),0 0 0 9px var(--yellow)}
canvas{display:block;width:100%;height:100%;border-radius:6px;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:2.5cqw;box-sizing:border-box;background:rgba(39,34,53,.18)}
.card{
  position:relative;background:var(--paper);color:var(--ink);
  width:min(92%,640px);max-height:94%;overflow:auto;box-sizing:border-box;
  padding:clamp(10px,3cqw,30px) clamp(12px,3.6cqw,36px);
  font-size:clamp(12px,2.25cqw,19px);line-height:1.35;
  border:2.5px solid var(--ink);border-radius:14px 6px 16px 5px/6px 16px 5px 14px;
  box-shadow:5px 6px 0 rgba(39,34,53,.35);
  transform:rotate(-.6deg);
  background-image:linear-gradient(var(--paper-shade) 1px,transparent 1px);background-size:100% 1.6em;
}
.card::before,.card::after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:var(--tape);transform:rotate(-8deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.card::before{left:18px}.card::after{right:18px;transform:rotate(7deg)}
.card h2{font-family:var(--font-display);font-weight:700;font-size:2.1em;line-height:1;margin:0 0 .25em;text-wrap:balance}
.card h2 mark{background:linear-gradient(transparent 55%,var(--yellow) 55%);color:inherit;padding:0 .1em}
.card .big{font-size:3.2em}
.card p{margin:.3em 0}
.card .sub{color:var(--ink-soft);font-size:1.05em}
.row{display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.tut{display:grid;grid-template-columns:auto 1fr;gap:.6em 1.1em;align-items:center}
.tut img{height:6.4em;width:auto;object-fit:contain;filter:drop-shadow(1px 2px 0 rgba(39,34,53,.15))}
.tut .sm{height:3.3em}
.coinimg{width:2.4em;height:2.4em;margin:.45em;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:inset 0 0 0 5px var(--yellow),inset 0 0 0 6.5px var(--ink);justify-self:center}
.tut ul{margin:0;padding-left:1.1em}
.tut li{margin:.15em 0}
.btns{display:flex;gap:.7em;flex-wrap:wrap;margin-top:.9em;align-items:center}
.btns .spacer{flex:1}
button{
  font-family:var(--font-display);font-weight:700;font-size:1.25em;cursor:pointer;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--ink);padding:.18em .9em;
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:2px 3px 0 var(--ink);
  transition:transform .08s ease;
}
button.primary{background:var(--yellow)}
button.ghost{border-style:dashed;box-shadow:none;font-size:1.05em}
button:hover{transform:translate(-1px,-1px) rotate(-1deg)}
button:active{transform:translate(1px,2px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
button[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.levels{display:flex;gap:.5em;flex-wrap:wrap}
.levels button{font-size:1.05em;padding:.1em .7em}
.dots{display:flex;gap:.35em}
.dots i{width:.55em;height:.55em;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.stat{display:grid;grid-template-columns:auto auto;gap:.1em 1.5em;justify-content:start;font-variant-numeric:tabular-nums;font-size:1.15em}
.hint{font-size:.9em;color:var(--ink-soft)}
.touch{display:none;width:min(100%,1100px);justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none}
.touch .pad{display:flex;gap:10px}
.touch button{font-size:1.4em;min-width:3.2em;min-height:2.4em;touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
@media (prefers-reduced-motion:reduce){button{transition:none}.card{transform:none}}
</style>
</head>
<body>


<header class="topbar">
  <h1>Sketchbook <span>Dash</span></h1>
  <p>Click the page, then play with <kbd>WASD</kbd> or <kbd>Arrows</kbd> · <kbd>Shift</kbd> runs · <kbd>Space</kbd> jumps</p>
</header>
<div class="stage" id="stage" tabindex="0" aria-label="Sketchbook Dash game">
  <canvas id="game" width="640" height="448"></canvas>
  <div class="overlay" id="overlay"></div>
</div>
<div class="touch" id="touch" aria-hidden="true">
  <div class="pad"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="pad"><button data-k="run">RUN</button><button data-k="jump" class="primary">JUMP</button></div>
</div>

/* ---------- utilities ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function wob(r,a){return (r()-.5)*2*a}
function wobLine(c,x1,y1,x2,y2,r,a=1){
  const len=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.round(len/9));
  c.moveTo(x1+wob(r,a*.6),y1+wob(r,a*.6));
  for(let i=1;i<=n;i++){const t=i/n;c.lineTo(x1+(x2-x1)*t+wob(r,a),y1+(y2-y1)*t+wob(r,a))}
}
function wobRect(c,x,y,w,h,r,a=1){
  c.beginPath();wobLine(c,x,y,x+w,y,r,a);wobLine(c,x+w,y,x+w,y+h,r,a);wobLine(c,x+w,y+h,x,y+h,r,a);wobLine(c,x,y+h,x,y,r,a);c.stroke();
}
function wash(c,x,y,w,h,col,r){
  c.fillStyle=col;c.fillRect(x,y,w,h);
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  c.strokeStyle='rgba(39,34,53,.09)';c.lineWidth=3;
  for(let i=-h;i<w;i+=7){c.beginPath();c.moveTo(x+i+wob(r,1),y+h);c.lineTo(x+i+h+wob(r,1),y);c.stroke()}
  c.restore();
}
const INK='#272235';
function seedRng(c,r){return mulberry((c*73856093)^(r*19349663)^0x5bd1e995)}

/* ---------- audio (tiny synth, starts after first input) ---------- */
let AC=null,muted=false;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f1,f2,dur,type='square',vol=.05,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.05){
  if(!AC||muted)return;const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=vol;s.buffer=b;s.connect(g).connect(AC.destination);s.start();
}

/* ---------- input ---------- */
const input={left:false,right:false,jump:false,run:false,down:false};
let jumpEdge=false;
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyK:'jump',
  ArrowDown:'down',KeyS:'down',ShiftLeft:'run',ShiftRight:'run',KeyJ:'run'};
window.addEventListener('keydown',e=>{
  audioInit();
  const k=KEYMAP[e.code];
  if(k&&G.mode!=='menu'){e.preventDefault()}
  if(k){if(k==='jump'&&!input.jump)jumpEdge=true;input[k]=true}
  if(e.code==='KeyM'){muted=!muted}
  if((e.code==='KeyP'||e.code==='Escape')&&(G.mode==='play'||G.mode==='pause')){e.preventDefault();togglePause();return}
  if(G.mode==='menu'&&overlay.firstElementChild){
    if(e.code==='Enter'&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){const b=overlay.querySelector('[data-primary]');if(b){e.preventDefault();b.click()}}
    else if(e.code==='Escape'){const b=overlay.querySelector('[data-esc]');if(b){e.preventDefault();b.click()}}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){const b=overlay.querySelector('[data-next]');if(b){e.preventDefault();b.click()}}
    else if(e.code==='ArrowLeft'||e.code==='KeyA'){const b=overlay.querySelector('[data-back]');if(b){e.preventDefault();b.click()}}
  }
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)input[k]=false});
window.addEventListener('blur',()=>{for(const k in input)input[k]=false;if(G.mode==='play')togglePause()});
stage.addEventListener('pointerdown',()=>{audioInit();stage.focus({preventScroll:true})});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();audioInit();if(k==='jump'&&!input.jump)jumpEdge=true;input[k]=true};
  const off=e=>{e.preventDefault();input[k]=false};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
});

// Builder: columns are tiles (32px). Rows 0..13, ground top is row 12.
function Builder(len,themeIdx,name){
  const map=[];for(let r=0;r<ROWS;r++)map.push(new Array(len).fill('.'));
  const L={w:len,map,contents:new Map(),enemies:[],sushi:[],pipes:[],flagX:0,castleX:0,theme:THEMES[themeIdx],themeIdx,name,decor:[]};
  const set=(c,r,t)=>{if(c>=0&&c<len&&r>=0&&r<ROWS)map[r][c]=t};
  const api={
    L,
    G(a,b){for(let c=a;c<=b;c++){set(c,12,'G');set(c,13,'D')}return api},
    row(x,r,s){[...s].forEach((ch,i)=>{const c=x+i;if(ch==='.')return;
      if(ch==='B')set(c,r,'B');else if(ch==='S')set(c,r,'S');else if(ch==='U')set(c,r,'U');
      else if(ch==='?'){set(c,r,'?');L.contents.set(c+','+r,'pts')}
      else if(ch==='g'){set(c,r,'?');L.contents.set(c+','+r,'sushi')}
      else if(ch==='c'){set(c,r,'?');L.contents.set(c+','+r,'coffee')}
      else if(ch==='b'){set(c,r,'B');L.contents.set(c+','+r,'pts')}
    });return api},
    pipe(x,h){for(let c=x;c<x+2;c++)for(let r=12-h;r<12;r++)set(c,r,'P');L.pipes.push({x,h});return api},
    col(x,h,t='S'){for(let r=12-h;r<12;r++)set(x,r,t);return api},
    up(x,n){for(let i=0;i<n;i++)api.col(x+i,i+1);return api},
    down(x,n){for(let i=0;i<n;i++)api.col(x+i,n-i);return api},

/* ---------- tile cache ---------- */
let cache={};
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*R);c.height=Math.ceil(h*R);const x=c.getContext('2d');x.scale(R,R);x.lineCap='round';x.lineJoin='round';return[c,x]}
function buildCaches(){
  cache={};
  for(let ti=0;ti<THEMES.length;ti++){
    const th=THEMES[ti];cache[ti]={};
    for(const type of ['G','D','B','?','U','S']){
      cache[ti][type]=[];
      for(let v=0;v<3;v++){
        const[cv,c]=makeCanvas(T,T);const r=mulberry(ti*1000+type.charCodeAt(0)*31+v*7);
        c.strokeStyle=INK;c.lineWidth=2;
        if(type==='G'){
          wash(c,0,0,T,T,th.dirt,r);
          c.fillStyle=th.grass;c.beginPath();c.moveTo(0,0);c.lineTo(T,0);c.lineTo(T,9);
          for(let x=T;x>=0;x-=4)c.lineTo(x,9+Math.sin(x*.7+v)*2.2);c.closePath();c.fill();
          c.beginPath();for(let x=0;x<=T;x+=4)c.lineTo(x,9+Math.sin(x*.7+v)*2.2);c.lineWidth=1.3;c.stroke();
          c.lineWidth=2;c.beginPath();wobLine(c,0,1,T,1,r,.7);c.stroke();
          c.lineWidth=1.2;for(let i=0;i<3;i++){const x=4+r()*24;c.beginPath();c.moveTo(x,1);c.lineTo(x+2,-3);c.stroke()}
          c.fillStyle='rgba(39,34,53,.35)';for(let i=0;i<2;i++){c.beginPath();c.arc(5+r()*22,16+r()*12,1.3+r()*1.2,0,7);c.fill()}
        }else if(type==='D'){
          wash(c,0,0,T,T,th.dirt,r);
          c.lineWidth=1.3;for(let i=0;i<2;i++){c.beginPath();c.ellipse(5+r()*22,5+r()*22,2+r()*2,1.5+r(),r()*3,0,7);c.stroke()}
        }else if(type==='B'){
          wash(c,0,0,T,T,'#f39a7c',r);
          c.lineWidth=1.6;c.beginPath();wobLine(c,1,16,31,16,r,.6);wobLine(c,16,1,16,16,r,.5);wobLine(c,8,16,8,31,r,.5);wobLine(c,24,16,24,31,r,.5);c.stroke();
          c.lineWidth=2.2;wobRect(c,1,1,T-2,T-2,r,.7);
        }else if(type==='?'){
          wash(c,0,0,T,T,'#ffd54f',r);c.lineWidth=2.2;wobRect(c,1.5,1.5,T-3,T-3,r,.7);
          c.fillStyle=INK;for(const[x,y]of[[5,5],[27,5],[5,27],[27,27]]){c.beginPath();c.arc(x,y,1.4,0,7);c.fill()}
          c.font='700 27px Gaegu, "Comic Sans MS", cursive';c.textAlign='center';c.textBaseline='middle';
          c.fillStyle='#fff6d0';c.fillText('?',17.2,18);c.fillStyle=INK;c.fillText('?',16,17);
        }else if(type==='U'){
          wash(c,0,0,T,T,'#d9c7a6',r);c.lineWidth=2.2;wobRect(c,1.5,1.5,T-3,T-3,r,.7);
          c.fillStyle=INK;for(const[x,y]of[[5,5],[27,5],[5,27],[27,27]]){c.beginPath();c.arc(x,y,1.4,0,7);c.fill()}
        }else if(type==='S'){
          wash(c,0,0,T,T,th.stone,r);c.lineWidth=2;wobRect(c,1.5,1.5,T-3,T-3,r,.7);
          c.lineWidth=1.1;c.strokeStyle='rgba(39,34,53,.55)';wobRect(c,6,6,T-12,T-12,r,.5);
          c.beginPath();c.moveTo(1.5,1.5);c.lineTo(6,6);c.moveTo(30.5,30.5);c.lineTo(26,26);c.stroke();
        }
        cache[ti][type].push(cv);
      }
    }
  }
  // clouds
  cache.cloud=[];
  for(let v=0;v<3;v++){
    const[cv,c]=makeCanvas(130,64);const r=mulberry(500+v);
    const bumps=[[28,40,20],[52,28,24],[80,30,22],[102,42,18],[64,46,22],[40,48,16],[90,50,15]];
    c.strokeStyle=INK;c.lineWidth=4.4;
    for(const[x,y,rr]of bumps){c.beginPath();c.arc(x,y,rr,0,7);c.stroke()}
    c.fillStyle='#ffffff';c.beginPath();for(const[x,y,rr]of bumps){c.moveTo(x+rr,y);c.arc(x,y,rr,0,7)}c.fill();
    c.fillStyle='rgba(143,184,232,.25)';c.beginPath();c.ellipse(64,54,44,6,0,0,7);c.fill();
    c.strokeStyle='rgba(39,34,53,.35)';c.lineWidth=1.2;c.beginPath();c.arc(48,34,9,Math.PI*1.1,Math.PI*1.6);c.stroke();
    cache.cloud.push(cv);
  }
}

/* ---------- tiles & physics ---------- */
const SOLID=new Set(['G','D','B','?','U','S','P']);
function tileAt(c,r){const L=G.L;if(r<0||r>=ROWS)return'.';if(c<0||c>=L.w)return'S';return L.map[r][c]}
function solidAt(c,r){if(r<0)return false;if(r>=ROWS)return false;if(c<0||c>=G.L.w)return true;return SOLID.has(G.L.map[r][c])}
function moveEntity(e,onBump,camBound){
  let hitX=0;
  e.x+=e.vx;
  if(camBound&&e.x<G.camX){e.x=G.camX;if(e.vx<0)e.vx=0}
  const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-.01)/T);
  if(e.vx>0){const c=Math.floor((e.x+e.w-.01)/T);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){e.x=c*T-e.w;hitX=1;break}}
  else if(e.vx<0){const c=Math.floor(e.x/T);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){e.x=(c+1)*T;hitX=-1;break}}
  if(hitX)e.vx=0;
  e.y+=e.vy;const was=e.onGround;e.onGround=false;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-.01)/T);
  if(e.vy>=0){const r=Math.floor((e.y+e.h)/T);for(let c=c0;c<=c1;c++)if(solidAt(c,r)&&e.y+e.h-e.vy<=r*T+1){e.y=r*T-e.h;e.vy=0;e.onGround=true;break}}
  else{const r=Math.floor(e.y/T);const hits=[];for(let c=c0;c<=c1;c++)if(solidAt(c,r))hits.push(c);
    if(hits.length){e.y=(r+1)*T;e.vy=0;if(onBump)onBump(hits,r)}}
  return hitX;
}

function bumpBlock(c,r,byBig){
  const L=G.L,t=L.map[r][c],key=c+','+r;
  if(t==='?'||(t==='B'&&L.contents.has(key))){
    L.map[r][c]='U';bumps.push({c,r,t:0});
    const what=L.contents.get(key);L.contents.delete(key);
    if(what==='pts'){addCoin(1);parts.push({k:'coin',x:c*T+16,y:r*T-6,vy:-7,life:32});floatText('200',c*T+4,r*T-24)}
    else{SFX.appear();items.push({type:what,x:c*T+(T-26)/2,y:r*T,w:26,h:30,vx:0,vy:0,emerge:32,base:r*T})}
    killAbove(c,r);
  }else if(t==='B'){
    if(byBig){L.map[r][c]='.';SFX.brk();G.score+=50;
      for(let i=0;i<4;i++)parts.push({k:'brick',x:c*T+8+(i%2)*16,y:r*T+8+(i>>1)*16,vx:(i%2?1:-1)*(1.5+Math.random()),vy:-7+(i>>1)*2.5,life:90,rot:0});
      killAbove(c,r);
    }else{bumps.push({c,r,t:0});SFX.bump();killAbove(c,r)}
  }else{SFX.bump()}
}
function killAbove(c,r){
  for(const e of enemies){if(e.type!=='walk'||e.dead)continue;
    if(Math.abs(e.y+e.h-r*T)<4&&e.x+e.w>c*T&&e.x<c*T+T){e.dead=true;e.flip=true;e.vy=-6;e.deadT=90;G.score+=100;floatText('100',e.x,e.y);SFX.stomp()}}
  for(const it of items){if(!it.static&&!it.emerge&&Math.abs(it.y+it.h-r*T)<4&&it.x+it.w>c*T&&it.x<c*T+T){it.vy=-7;it.vx=(it.x+it.w/2<c*T+16)?-Math.abs(it.vx||2):Math.abs(it.vx||2)}}
}

function hurt(){

  if(P.big){setBig(false)}
  else{P.hearts--;if(P.hearts<=0){P.hearts=0;die();return}}

function setBig(b){
  if(b===P.big)return;const S=b?BIG:SMALL;const cx=P.x+P.w/2,bottom=P.y+P.h;
  P.big=b;P.w=S.w;P.h=S.h;P.x=cx-P.w/2;P.y=bottom-P.h;
  // un-stick from ceilings when growing
  if(b){const r=Math.floor(P.y/T);for(let c=Math.floor(P.x/T);c<=Math.floor((P.x+P.w-.01)/T);c++)if(solidAt(c,r)){P.y=(r+1)*T;break}}
}

  let x=P.safe.x;

    for(let c=Math.ceil((G.camX+8)/T);c<G.L.w;c++){let top=-1;for(let r=2;r<ROWS;r++)if(solidAt(c,r)&&!solidAt(c,r-1)&&!solidAt(c,r-2)){top=r;break}
      if(top>0){x=c*T+6;P.safe.b=top*T;break}}
  }
  P.x=x;P.y=P.safe.b-P.h;P.vx=0;P.vy=0;P.inv=120;

function updatePlayer(){
  const p=P;
  if(p.inv>0)p.inv--;if(p.slowT>0)p.slowT--;if(p.poseT>0)p.poseT--;if(p.speedT>0)p.speedT--;
  let L_=input.left,R_=input.right,J=input.jump,RUN=input.run,jE=jumpEdge;
  if(G.bot){const b=botInput();L_=false;R_=true;RUN=true;J=b.j;jE=b.je}
  if(G.mode==='auto'){L_=false;R_=true;RUN=false;J=false;jE=false}
  const mult=(p.speedT>0?1.5:1)*(p.slowT>0?2/3:1);
  const maxV=(RUN?5.125:3.125)*mult,acc=(RUN?.1113:.0742)*mult;
  const dir=(R_?1:0)-(L_?1:0);
  if(dir){
    if(p.onGround&&Math.sign(p.vx)===-dir&&Math.abs(p.vx)>.6){p.vx+=dir*.203*mult;if(G.frame%6===0)dust(p.x+p.w/2,p.y+p.h)}
    else p.vx+=dir*acc;
    if(Math.abs(p.vx)>maxV){const s=Math.sign(p.vx);p.vx-=s*.1016;if(Math.abs(p.vx)<maxV)p.vx=s*maxV}
    if(p.onGround||Math.sign(p.vx)===dir)p.facing=dir;
  }else if(p.onGround){const s=Math.sign(p.vx);p.vx-=s*.1016;if(Math.sign(p.vx)!==s)p.vx=0}
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(jE&&p.coyote>0&&!p.jumping){
    const s=Math.abs(p.vx);
    if(s>4.625){p.vy=-10;p.jumpG=[.3125,1.125]}else if(s>2){p.vy=-8;p.jumpG=[.234,.75]}else{p.vy=-8;p.jumpG=[.25,.875]}
    p.jumping=true;p.onGround=false;p.coyote=0;p.squash=-.15;SFX.jump();
  }
  const g=(p.vy<0&&J&&p.jumping)?p.jumpG[0]:p.jumpG[1];
  p.vy=Math.min(p.vy+g,8);
  const wasAir=!p.onGround;
  moveEntity(p,(hits,r)=>{
    const cx=p.x+p.w/2;hits.sort((a,b)=>Math.abs(a*T+16-cx)-Math.abs(b*T+16-cx));
    bumpBlock(hits[0],r,p.big);p.jumping=false;
  },true);
  if(p.x+p.w>G.L.w*T)p.x=G.L.w*T-p.w;
  if(p.onGround){if(wasAir){p.squash=.18;if(p.airT>10)dust(p.x+p.w/2,p.y+p.h)}p.jumping=false;p.jumpG=[.25,.875];p.airT=0}else p.airT++;
  p.squash*=.82;
  p.dist+=Math.abs(p.vx);
  // remember safe ground
  if(p.onGround){const r=Math.floor((p.y+p.h)/T);if(solidAt(Math.floor(p.x/T),r)&&solidAt(Math.floor((p.x+p.w-.01)/T),r)){p.safe.x=p.x;p.safe.b=p.y+p.h}}
  // pits
  if(p.y>VH+30){
    if(G.god){respawn();G.falls=(G.falls||0)+1;return}
    SFX.hit();
    if(p.big)setBig(false);
    p.hearts--;if(p.hearts<=0){p.hearts=0;die();return}
    respawn();p.slowT=0;
  }
  // flag
  const L=G.L;
  if(G.mode==='play'&&p.x+p.w>=L.flagX*T){startFlag()}
}
function dust(x,y){for(let i=0;i<3;i++)parts.push({k:'dust',x:x+(Math.random()-.5)*10,y:y-3,vx:(Math.random()-.5)*1.4,vy:-Math.random()*.8,life:24})}

/* ---------- flag & level clear ---------- */

  const L=G.L,p=P;G.mode='flag';SFX.flag();
  const poleX=L.flagX*T+16;p.x=poleX-p.w-1;p.vx=0;p.vy=0;p.facing=1;
  const h=clamp((11*T-(p.y+p.h))/(9*T),0,1);const pts=[100,400,800,2000,5000][Math.min(4,Math.floor(h*5))];

function updateFlag(){

function updateDance(){

/* ---------- enemies & items ---------- */
function updateEnemies(){
  const p=P,pcx=p.x+p.w/2,pcy=p.y+p.h/2;
  for(const e of enemies){
    if(e.gone)continue;
    if(!e.active){if((e.type==='walk'?e.x:e.px)<G.camX+VW+48)e.active=true;else continue}
    if(e.type==='walk'){
      e.t++;
      if(e.dead){
        if(e.flip){e.vy+=.5;e.y+=e.vy;e.x+=e.vx*.5;if(e.y>VH+80)e.gone=true}
        else if(--e.deadT<=0)e.gone=true;
        continue;
      }
      e.vy=Math.min(e.vy+.5,8);
      const hx=moveEntity(e);if(hx)e.vx=hx>0?-e.spd:e.spd;e.roll+=e.vx/17;
      if(e.y>VH+40){e.gone=true;continue}
      for(const o of enemies){if(o===e||o.type!=='walk'||o.dead||o.gone||!o.active)continue;
        if(overlap(e,o)){if(e.x<o.x){e.vx=-e.spd;o.vx=o.spd}else{e.vx=e.spd;o.vx=-o.spd}}}
      if(!p.dead&&overlap(p,{x:e.x+4,y:e.y+4,w:e.w-8,h:e.h-4})){
        if(p.vy>0&&p.y+p.h-p.vy<=e.y+14){
          e.dead=true;e.deadT=40;SFX.stomp();p.vy=input.jump?-9:-6;p.jumping=input.jump;p.jumpG=[.25,.875];
          G.combo=(p.onGround?0:(G.combo||0))+1;const pts=[100,200,400,500,800,1000][Math.min(5,G.combo-1)];G.score+=pts;floatText(String(pts),e.x,e.y);
          sparkle(e.x+17,e.y+20);
        }else hurt();
      }
    }else{ // chomp
      e.t++;if(e.cd>0)e.cd--;
      const restX=e.px+Math.sin(e.t*.025)*34,restY=e.py-24-Math.abs(Math.sin(e.t*.11))*16;
      if(e.st==='idle'){
        e.x=lerp(e.x,restX,.2);e.y=lerp(e.y,restY,.3);e.ang=Math.sin(e.t*.08)*.25;
        const dx=pcx-e.px,dy=pcy-(e.py-24);
        if(!p.dead&&e.cd<=0&&Math.abs(dx)<e.cfg.range+60&&Math.abs(dy)<160&&G.mode==='play'){e.st='wind';e.wt=0}
      }else if(e.st==='wind'){
        e.wt++;e.x=restX+(Math.random()-.5)*5;e.y=restY+(Math.random()-.5)*4;e.ang=Math.sin(e.wt*.9)*.35;
        if(e.wt>=e.cfg.wind){let dx=pcx-e.px,dy=pcy-(e.py-24);const d=Math.hypot(dx,dy)||1,m=Math.min(d,e.cfg.range);
          e.tx=e.px+dx/d*m;e.ty=Math.min(e.py-20,e.py-24+dy/d*m);e.st='lunge';SFX.chomp()}
      }else if(e.st==='lunge'){
        const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);e.ang+=.35;
        const sp=e.cfg.spd;if(d<sp){e.x=e.tx;e.y=e.ty;e.st='hold';e.wt=0}else{e.x+=dx/d*sp;e.y+=dy/d*sp}
      }else if(e.st==='hold'){if(++e.wt>20)e.st='back'}
      else if(e.st==='back'){const dx=restX-e.x,dy=restY-e.y,d=Math.hypot(dx,dy);e.ang*=.9;
        if(d<4){e.st='idle';e.cd=e.cfg.cd}else{e.x+=dx/d*3;e.y+=dy/d*3}}
      if(!p.dead){const cx=clamp(e.x,p.x,p.x+p.w),cy=clamp(e.y,p.y,p.y+p.h);if(Math.hypot(e.x-cx,e.y-cy)<e.r-3)hurt()}
    }
  }
}
function updateItems(){
  const p=P;
  for(const it of items){

    if(it.emerge>0){it.y-=1;it.emerge--;if(it.emerge===0){it.vx=2}continue}
    it.vy=Math.min(it.vy+.5,8);const hx=moveEntity(it);if(hx)it.vx=hx>0?-2:2;
    if(it.y>VH+40){it.gone=true;continue}
    if(!p.dead&&overlap(p,it)){it.gone=true;
      if(it.type==='sushi'){
        const full=P.hearts>=3;
        if(!P.big){setBig(true);floatText('1000',it.x,it.y)}else if(!full){P.hearts++;SFX.heal();floatText('+\u2665',it.x,it.y)}
        if(full){addCoin(3);for(let k=0;k<3;k++)parts.push({k:'coin',x:it.x+13+(k-1)*16,y:it.y,vy:-6-k,life:34});floatText('+3 coins',it.x,it.y-26)}

      }else if(it.type==='coffee'){P.speedT=600;P.poseT=0;G.score+=1000;floatText('SPEED!',it.x,it.y);SFX.speed();sparkle(it.x+13,it.y+10)}

}
function sparkle(x,y){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;parts.push({k:'star',x,y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:26})}}
function updateParts(){
  for(const q of parts){q.life--;

  parts=parts.filter(q=>q.life>0);

/* ---------- camera ---------- */
function updateCamera(){
  const target=P.x+P.w/2-VW*.42;
  if(target>G.camX)G.camX=target;
  G.camX=clamp(G.camX,0,G.L.w*T-VW);

/* ---------- main update ---------- */
function step(){
  G.frame++;
  const m=G.mode;
  if(m==='play'){
    updatePlayer();if(G.mode==='play'||G.mode==='flag'){updateEnemies();updateItems()}
    updateParts();updateCamera();
    if(G.mode==='play'&&!G.god){if(++G.timeAcc>=FPS){G.timeAcc=0;G.time--;if(G.time===60)tone(880,0,.3,'square',.04);if(G.time<=0){G.time=0;die()}}}
  }else if(m==='intro'){if(--G.introT<=0)G.mode='play';updateParts()}
  else if(m==='flag'){updateFlag();updateParts();updateEnemies()}
  else if(m==='auto'){updateAuto();updateParts();updateCamera()}
  else if(m==='dance'){updateDance();updateParts()}
  else if(m==='dying'){
    const p=P;p.deadT++;
    if(p.deadT===40){p.vy=-11;sparkle(p.x+p.w/2,p.y+p.h/2);for(let i=0;i<6;i++)dust(p.x+p.w/2,p.y+p.h-i*8)}
    if(p.deadT>40){p.vy+=.55;p.y+=p.vy}
    if(p.deadT===170)showGameOver();
    updateParts();
  }else if(m==='menu'){
    if(G.attract){G.camX+=.7;if(G.camX>G.L.w*T-VW)G.camX=0}
    for(const it of items)if(it.static)it.t+=.06;
    for(const e of enemies)if(e.type==='chomp'){e.t++;e.x=e.px+Math.sin(e.t*.025)*34;e.y=e.py-24-Math.abs(Math.sin(e.t*.11))*16;e.ang=Math.sin(e.t*.08)*.25}
  }
  jumpEdge=false;
}

function drawSprite(name,cx,bottom,bodyH,flipX,rot=0,sx=1,sy=1,alpha=1){
  const im=IMG[name],m=META[name];if(!im||!im.complete)return;

  const w=m.w*s,h=m.h*s;
  const bcx=(body[2]+body[3])/2*s,bbot=body[1]*s;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,bottom);if(rot)ctx.rotate(rot);ctx.scale((flipX?-1:1)*sx,sy);
  ctx.drawImage(im,-bcx,-bbot,w,h);ctx.restore();
}
function drawIcon(name,cx,cy,size,rot=0,alpha=1,sx=1,sy=1){
  const im=IMG[name],m=META[name];if(!im||!im.complete)return;
  const s=size/Math.max(m.w,m.h);ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);if(rot)ctx.rotate(rot);if(sx!==1||sy!==1)ctx.scale(sx,sy);ctx.drawImage(im,-m.w*s/2,-m.h*s/2,m.w*s,m.h*s);ctx.restore();

function drawBackground(L){
  const th=L.theme,cam=G.camX;
  ctx.fillStyle=th.paper;ctx.fillRect(0,0,VW,VH);
  // graph paper aligned with the tile grid
  ctx.lineWidth=1;
  ctx.strokeStyle=th.grid2;ctx.beginPath();
  for(let x=-(cam%16);x<VW;x+=16){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,VH)}
  for(let y=0;y<VH;y+=16){ctx.moveTo(0,y+.5);ctx.lineTo(VW,y+.5)}ctx.stroke();
  ctx.strokeStyle=th.grid;ctx.beginPath();
  for(let x=-(cam%32);x<VW;x+=32){ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,VH)}
  for(let y=0;y<VH;y+=32){ctx.moveTo(0,y+.5);ctx.lineTo(VW,y+.5)}ctx.stroke();
  for(const d of L.decor){
    const x=d.x-cam*d.p;
    if(d.k==='cloud'){const cx=((x%(L.w*T))+L.w*T)%(L.w*T);if(cx>VW+20||cx<-150)continue;ctx.drawImage(cache.cloud[d.v],cx,d.y,130,64)}

    else if(d.k==='star'){const sx=((x%(VW+40))+VW+40)%(VW+40)-20;ctx.strokeStyle='rgba(39,34,53,.5)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(sx-d.s,d.y);ctx.lineTo(sx+d.s,d.y);ctx.moveTo(sx,d.y-d.s);ctx.lineTo(sx,d.y+d.s);ctx.stroke()}
    else if(d.k==='moon'){ctx.fillStyle='#fff7cf';ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(x,d.y,30,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=th.paper;ctx.beginPath();ctx.arc(x+14,d.y-8,26,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+14,d.y-8,26,Math.PI*.55,Math.PI*1.45);ctx.stroke()}
  }
}
function drawHill(x,base,w,h,th,d){

  ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(x+w*.42,base-h*.55,3,6,0,0,7);ctx.ellipse(x+w*.58,base-h*.55,3,6,0,0,7);ctx.stroke();

  wobRect(ctx,cx,base-3*T,5*T,3*T,rng,.8);wobRect(ctx,cx+T,base-5*T,3*T,2*T,rng,.8);
  ctx.lineWidth=1.2;for(let yy=base-3*T+16;yy<base;yy+=16){ctx.beginPath();wobLine(ctx,cx+2,yy,cx+5*T-2,yy,rng,.5);ctx.stroke()}
  ctx.lineWidth=2.2;ctx.fillStyle='#e6d3bd';
  for(let i=0;i<5;i++){ctx.fillRect(cx+i*T+4,base-3*T-12,T-10,12);ctx.strokeRect(cx+i*T+4,base-3*T-12,T-10,12)}
  ctx.fillStyle='#efdfcc';for(let i=0;i<3;i++){ctx.fillRect(cx+T+i*T+5,base-5*T-12,T-12,12);ctx.strokeRect(cx+T+i*T+5,base-5*T-12,T-12,12)}
  ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(cx+2*T,base);ctx.lineTo(cx+2*T,base-T-6);ctx.arc(cx+2.5*T,base-T-6,T/2,Math.PI,0);ctx.lineTo(cx+3*T,base);ctx.closePath();ctx.fill();
  ctx.fillRect(cx+2.2*T,base-4.3*T,8,16);ctx.fillRect(cx+2.6*T,base-4.3*T,8,16);
  // pennant
  ctx.beginPath();ctx.moveTo(cx+2.5*T,base-5*T-12);ctx.lineTo(cx+2.5*T,base-6.3*T);ctx.stroke();
  ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.moveTo(cx+2.5*T,base-6.3*T);ctx.lineTo(cx+2.5*T+26,base-6.3*T+8+Math.sin(G.frame*.12)*2);ctx.lineTo(cx+2.5*T,base-6.3*T+16);ctx.closePath();ctx.fill();ctx.stroke();
}
function drawEnemies(){
  for(const e of enemies){
    if(e.gone)continue;
    if(e.type==='walk'){
      const x=e.x+e.w/2-G.camX;if(x<-60||x>VW+60)continue;
      if(e.dead&&!e.flip){drawIcon('iblogo',x,e.y+e.h-7,42,0,1,1.25,.32);continue}
      if(e.dead){drawIcon('iblogo',x,e.y+e.h/2,42,Math.PI+e.t*.1,1,1,-1);continue}
      const bob=Math.abs(Math.sin(e.t*.3))*2;
      drawIcon('iblogo',x,e.y+e.h/2-1-bob,42,e.roll);
    }else{
      const px=e.px-G.camX;if(px<-260||px>VW+260)continue;
      // peg
      ctx.fillStyle='#c9a77c';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.fillRect(px-5,e.py-14,10,14);ctx.strokeRect(px-5,e.py-14,10,14);
      ctx.beginPath();ctx.ellipse(px,e.py-14,5,2.5,0,0,7);ctx.fill();ctx.stroke();
      // chain
      const ex=e.x-G.camX,ey=e.y,d=Math.hypot(ex-px,ey-(e.py-12)),sag=Math.max(0,26-d*.18);
      for(let i=1;i<=6;i++){const t=i/7,lx=lerp(px,ex,t),ly=lerp(e.py-12,ey,t)+Math.sin(Math.PI*t)*sag;
        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(lx,ly,5,3.6,Math.atan2(ey-e.py,ex-px)+(i%2?0:1.4),0,7);ctx.fill();ctx.stroke()}
      drawIcon('math',ex,ey,50,e.ang);
      if(e.st==='wind'){ctx.strokeStyle=INK;ctx.lineWidth=2;for(let k=0;k<3;k++){const a=-1.9+k*.5;ctx.beginPath();ctx.moveTo(ex+Math.cos(a)*30,ey+Math.sin(a)*30);ctx.lineTo(ex+Math.cos(a)*38,ey+Math.sin(a)*38);ctx.stroke()}}
    }
  }
}
function drawItems(front){
  for(const it of items){
    const x=it.x-G.camX;if(x<-40||x>VW+40)continue;
    if(front&&it.emerge>0)continue;if(!front&&!(it.emerge>0))continue;
    if(it.static){coin(x+10,it.y+10+Math.sin(it.t)*2,Math.cos(it.t*.8));continue}
    if(it.type==='coffee')drawIcon('coffee',x+13,it.y+14,38);
    else drawIcon('sushi',x+13,it.y+16,38,Math.sin(G.frame*.1)*.1);
  }
}
function drawPlayer(){
  const p=P;if(!p)return;
  if(p.inv>0&&!p.dead&&Math.floor(p.inv/4)%2===0&&G.mode==='play')return;
  const bodyH=p.big?BIG.draw:SMALL.draw;
  const cx=p.x+p.w/2-G.camX,bottom=p.y+p.h+2;
  let name='walk',flip=p.facing<0,rot=0,sx=1,sy=1,bob=0;
  const moving=Math.abs(p.vx)>.3;
  if(p.dead){
    if(p.deadT<40){drawSprite('hit',cx,p.y+p.h,bodyH,flip,Math.sin(p.deadT*.8)*.06);return}
    drawSprite('skeleton',cx,p.y+p.h,bodyH,flip,Math.sin(p.deadT*.15)*.12);return}
  if(G.mode==='dance'||G.mode==='dancebg'){
    name='win';flip=Math.floor(p.danceT/120)%2===1;const hop=Math.abs(Math.sin(p.danceT*.1))*6;
    drawSprite('win',cx,bottom-hop,bodyH*1.02,flip);return;
  }
  if(p.slowT>0)name='hit';
  else if(p.poseT>0)name='powerup';
  else if(p.speedT>0)name='speed';
  if(name==='walk'||name==='speed'){
    if(p.onGround&&moving){const ph=p.dist*(name==='speed'?.09:.13);bob=Math.abs(Math.sin(ph))*3;rot=Math.sin(ph)*.07*(flip?-1:1)}
    if(!p.onGround)rot=(p.vy<0?-.08:.06)*(flip?-1:1);
  }
  if(name==='hit'&&moving){rot=Math.sin(p.dist*.1)*.05}
  sy=1+p.squash*-1;sx=1+p.squash*.8;
  if(name==='speed'&&p.onGround&&G.frame%5===0)dust(p.x+p.w/2-p.facing*10,p.y+p.h);
  const alpha=p.inv>0?.85:1;
  drawSprite(name,cx,bottom-bob,name==='powerup'?bodyH*1.12:bodyH,flip,rot,sx,sy,alpha);
}
function drawParts(){
  for(const q of parts){
    const x=q.x-G.camX,a=clamp(q.life/20,0,1);
    if(q.k==='brick'){ctx.save();ctx.translate(x,q.y);ctx.rotate(q.rot);ctx.fillStyle='#f39a7c';ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.fillRect(-6,-5,12,10);ctx.strokeRect(-6,-5,12,10);ctx.restore()}
    else if(q.k==='bone'){ctx.save();ctx.translate(x,q.y);ctx.rotate(q.rot);ctx.globalAlpha=a;ctx.strokeStyle=INK;ctx.fillStyle='#fff';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.rect(-7,-1.6,14,3.2);ctx.fill();ctx.stroke();for(const s of[-1,1])for(const t of[-1,1]){ctx.beginPath();ctx.arc(s*8,t*2,2.4,0,7);ctx.fill();ctx.stroke()}ctx.restore()}
    else if(q.k==='pop'){ctx.globalAlpha=a;ctx.fillStyle='#ffd54f';ctx.strokeStyle=INK;ctx.lineWidth=1.6;star(x,q.y,9);ctx.globalAlpha=1}
    else if(q.k==='coin'){ctx.globalAlpha=a;coin(x,q.y,Math.cos(q.life*.5));ctx.globalAlpha=1}
    else if(q.k==='dust'){ctx.globalAlpha=a*.7;ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,q.y,2+(24-q.life)*.25,0,7);ctx.stroke();ctx.globalAlpha=1}
    else if(q.k==='star'){ctx.globalAlpha=a;ctx.fillStyle='#ffd54f';ctx.strokeStyle=INK;ctx.lineWidth=1.3;star(x,q.y,5);ctx.globalAlpha=1}
    else if(q.k==='text'){ctx.globalAlpha=a;ctx.font='700 18px Gaegu, cursive';ctx.textAlign='left';ctx.lineWidth=4;ctx.strokeStyle='#ffffff';ctx.strokeText(q.s,x,q.y);ctx.fillStyle=INK;ctx.fillText(q.s,x,q.y);ctx.globalAlpha=1}
  }
}
function coin(x,y,spin=1){
  const w=Math.max(.2,Math.abs(spin));
  ctx.fillStyle='#ffd54f';ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(x,y,10*w,10,0,0,7);ctx.fill();ctx.stroke();
  if(w>.45){ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(x,y,6.2*w,6.2,0,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(x-4*w,y-4,1.6*w,3,.6,0,7);ctx.fill()}
}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke()}
function heart(x,y,s,full){
  ctx.beginPath();ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x,y-s*.1,x-s*.55,y-s*.1,x-s*.55,y+s*.3);ctx.bezierCurveTo(x-s*.55,y+s*.6,x,y+s*.8,x,y+s);
  ctx.bezierCurveTo(x,y+s*.8,x+s*.55,y+s*.6,x+s*.55,y+s*.3);ctx.bezierCurveTo(x+s*.55,y-s*.1,x,y-s*.1,x,y+s*.3);ctx.closePath();
  ctx.lineWidth=2.2;ctx.strokeStyle=INK;
  if(full){ctx.fillStyle='#f2876a';ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(x-s*.28,y+s*.22,2.2,3.4,-.5,0,7);ctx.fill()}
  else{ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill();ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([])}
}
function hudText(s,x,y,size=20,align='left'){ctx.font=`700 ${size}px Gaegu, "Comic Sans MS", cursive`;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.strokeText(s,x,y);ctx.fillStyle=INK;ctx.fillText(s,x,y)}
function drawHUD(){
  if(!P)return;
  if(G.L.theme.deco==='library'){ctx.fillStyle='rgba(233,236,244,.82)';ctx.fillRect(0,0,VW,56);ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();wobLine(ctx,0,56,VW,56,seedRng(1,2),.6);ctx.stroke()}
  for(let i=0;i<3;i++)heart(26+i*28,12,22,i<P.hearts);
  if(P.speedT>0){const w=74*(P.speedT/600);ctx.fillStyle='#8fd0e8';ctx.fillRect(14,40,w,7);ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.strokeRect(14,40,74,7);hudText('\u00d71.5',94,48,15)}
  if(P.slowT>0){hudText('dazed',14,P.speedT>0?66:50,15)}
  coin(128,28,1);hudText('\u00d7 '+String(G.coins).padStart(2,'0'),144,36,22);
  hudText('SCORE',250,22,15);hudText(String(G.score).padStart(6,'0'),250,40,22);
  hudText('LEVEL',400,22,15);hudText(String(G.levelIdx+1)+' of 5',400,40,22);
  hudText('TIME',540,22,15);hudText(String(Math.max(0,G.time)).padStart(3,'0'),540,40,22);
  if(muted)hudText('muted (M)',VW-12,VH-12,14,'right');
}
function drawIntro(){
  ctx.fillStyle='rgba(39,34,53,.35)';ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.translate(VW/2,VH/2);ctx.rotate(-.02);
  ctx.fillStyle='#fffdf6';ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.fillRect(-190,-70,380,140);ctx.strokeRect(-190,-70,380,140);
  ctx.fillStyle='rgba(255,236,170,.85)';ctx.save();ctx.rotate(-.1);ctx.fillRect(-170,-84,70,22);ctx.restore();
  ctx.restore();
  hudText('LEVEL '+(G.levelIdx+1),VW/2,VH/2-18,26,'center');
  hudText(G.L.name,VW/2,VH/2+20,38,'center');
  drawSprite('walk',VW/2-150,VH/2+52,60,false);
  for(let i=0;i<3;i++)heart(VW/2+110+i*22,VH/2+30,16,true);
}
function render(){
  const L=G.L;if(!L)return;
  ctx.setTransform(R,0,0,R,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.lineCap='round';ctx.lineJoin='round';
  drawBackground(L);
  drawFlagCastle(L);
  drawItems(false);
  drawPipes(L);
  drawTiles(L);
  drawItems(true);
  drawEnemies();
  if(G.mode!=='menu')drawPlayer();
  drawParts();
  if(G.mode!=='menu')drawHUD();
  if(G.mode==='intro')drawIntro();
  if(G.mode==='pause'){ctx.fillStyle='rgba(39,34,53,.35)';ctx.fillRect(0,0,VW,VH);hudText('Paused',VW/2,VH/2,48,'center');hudText('press P or Esc to keep going',VW/2,VH/2+34,20,'center')}
}

let last=performance.now(),acc=0;
/* ---------- menus ---------- */
function show(html){overlay.innerHTML=html;overlay.hidden=false;const f=overlay.querySelector('[data-primary]');if(f)f.focus({preventScroll:true})}
function hide(){overlay.hidden=true;overlay.innerHTML='';stage.focus({preventScroll:true})}
function img(n,cls=''){return`<img class="${cls}" alt="" src="${SRC[n]}">`}
function titleScreen(){
  G.mode='menu';G.attract=true;loadLevel(0);
  const lv=[0,1,2,3,4].map(i=>`<button ${i<unlocked?'':'disabled'} data-lv="${i}" aria-label="Level ${i+1}">${i+1}</button>`).join('');
  show(`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div style="min-width:0;flex:1 1 14em">
        <h2 class="big">Sketchbook <mark>Dash</mark></h2>
        <p class="sub">A five-level pen-and-paper platformer. Stomp the IB logos, dodge the math chomp, grab the flag.</p>
      </div>
      <div class="row" style="gap:.3em">${img('walk')}</div>
    </div>
    <div class="btns">
      <button class="primary" data-primary id="b-play">Play</button>
      <button id="b-how">How to play</button>
      <span class="spacer"></span>
      <span class="hint">Levels</span><div class="levels">${lv}</div>
    </div>
    <p class="hint">Enter to start · M mutes sound · works with WASD and the arrow keys</p>
  </div>`);
  overlay.querySelector('#b-play').onclick=()=>tutorial(0,0);
  overlay.querySelector('#b-how').onclick=()=>tutorial(0,0);
  overlay.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.lv));
  overlay.querySelector('.row img').style.height='9em';
}
const TUT=[
  {h:'Meet the <mark>runner</mark>',img:'walk',body:`<ul>
    <li><b>Move:</b> A / D or ← / →</li>
    <li><b>Jump:</b> W, ↑ or Space. Hold it to jump higher.</li>
    <li><b>Run:</b> hold Shift while moving.</li>
    <li><b>Pause:</b> P or Esc · <b>Sound:</b> M</li></ul>`},
  {h:'Three <mark>hearts</mark>',img:'hit',body:`<ul>
    <li>Touching an enemy costs one heart, makes you dazed and slows you to two-thirds speed for 3 seconds.</li>
    <li>When you are tall, a hit only shrinks you back. No heart lost.</li>
    <li>Falling into a gap costs a heart and puts you back on solid ground.</li>
    <li>Lose all three and it is game over.</li></ul>`},
  {h:'Hit the <mark>? blocks</mark>',img:'powerup',body:`<div class="tut">
    ${img('sushi','sm')}<div><b>Sushi</b> makes you tall: you can smash bricks and survive one extra hit. Already tall? It heals a heart. All three hearts full? You get 3 coins.</div>
    ${img('coffee','sm')}<div><b>Iced coffee</b> gives you 1.5× speed for 10 seconds.</div>
    <span class="coinimg"></span><div><b>Coins</b> pop out of the other ? blocks and float over gaps. Each one is worth 200 points.</div></div>`},
  {h:'Know your <mark>enemies</mark>',img:'speed',body:`<div class="tut">
    ${img('iblogo','sm')}<div><b>IB logo</b> rolls back and forth. Jump on it to flatten it, or bump the block under it. They get faster each level.</div>
    ${img('math','sm')}<div><b>Math chomp</b> is chained to a peg. It shakes, then lunges. It can't be stomped, so wait for the lunge and dash past.</div></div>`},
  {h:'Reach the <mark>flag</mark>',img:'win',body:`<ul>
    <li>Each level ends at a flagpole. Grab it as high as you can for bonus points.</li>
    <li>Leftover time turns into score.</li>
    <li>Five levels, each one harder than the last.</li></ul>`},
];
function tutorial(i,startAt){
  G.mode='menu';G.attract=true;
  const t=TUT[i],last=i===TUT.length-1;
  const dots=TUT.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  show(`<div class="card">
    <div class="row" style="justify-content:space-between"><span class="hint">How to play · ${i+1} of ${TUT.length}</span><div class="dots">${dots}</div></div>
    <div class="tut" style="margin-top:.4em">${img(t.img)}<div style="min-width:0"><h2>${t.h}</h2>${t.body}</div></div>
    <div class="btns">
      <button class="ghost" data-esc id="t-skip">Skip tutorial</button>
      <span class="spacer"></span>
      ${i>0?'<button data-back id="t-back">Back</button>':''}
      <button class="primary" data-primary data-next id="t-next">${last?'Start level '+(startAt+1):'Next'}</button>
    </div>
  </div>`);
  overlay.querySelector('#t-skip').onclick=()=>startLevel(startAt);
  const bk=overlay.querySelector('#t-back');if(bk)bk.onclick=()=>tutorial(i-1,startAt);
  overlay.querySelector('#t-next').onclick=()=>last?startLevel(startAt):tutorial(i+1,startAt);
}
function startLevel(i){
  hide();G.attract=false;loadLevel(i);
  if(i===0){G.score=0;G.coins=0}
  G.levelStartScore=G.score;G.levelStartCoins=G.coins;
  G.mode='intro';G.introT=G.bot?1:110;
}
function togglePause(){if(G.mode==='play'){G.mode='pause'}else if(G.mode==='pause'){G.mode='play'}}
function showClear(){
  G.mode='menu';G.attract=false;saveUnlock(G.levelIdx+2);
  const lastLvl=G.levelIdx===LEVELS.length-1;
  if(lastLvl){show(`<div class="card">
      <div class="tut">${img('win')}<div style="min-width:0"><h2 class="big">You <mark>did it!</mark></h2>
      <p class="sub">All five levels cleared. IB, maths and exam night: handled.</p>
      <div class="stat"><span>Final score</span><b>${G.score}</b><span>Coins collected</span><b>${G.coins}</b></div></div></div>
      <div class="btns"><button class="primary" data-primary id="c-again">Play again</button><button id="c-title">Title screen</button></div></div>`);
    overlay.querySelector('#c-again').onclick=()=>startLevel(0);overlay.querySelector('#c-title').onclick=titleScreen;
  }else{show(`<div class="card" style="width:min(80%,460px)">
      <h2>Level ${G.levelIdx+1} <mark>cleared!</mark></h2>
      <div class="stat"><span>Score</span><b>${G.score}</b><span>Coins this level</span><b>${G.coins-G.levelStartCoins}</b><span>Hearts left</span><b>${P.hearts} of 3</b></div>
      <div class="btns"><button class="primary" data-primary id="c-next">Next: ${LEVELS[G.levelIdx+1]().name}</button><button class="ghost" id="c-title">Title</button></div></div>`);
    overlay.querySelector('#c-next').onclick=()=>startLevel(G.levelIdx+1);overlay.querySelector('#c-title').onclick=titleScreen;
  }
  // keep her dancing behind the card
  G.mode='dancebg';
}
function showGameOver(){
  G.mode='menu';G.attract=false;
  show(`<div class="card" style="width:min(82%,480px)">
    <div class="tut">${img('skeleton')}<div style="min-width:0"><h2>Out of <mark>hearts</mark></h2>
    <p class="sub">${G.time<=0?'The clock ran out.':'Shake it off and try '+G.L.name+' again.'}</p></div></div>
    <div class="btns"><button class="primary" data-primary id="g-retry">Retry level ${G.levelIdx+1}</button><button class="ghost" id="g-title">Title</button></div></div>`);
  overlay.querySelector('#g-retry').onclick=()=>{G.score=G.levelStartScore;G.coins=G.levelStartCoins;startLevel(G.levelIdx);if(G.levelIdx===0){}};
  overlay.querySelector('#g-title').onclick=titleScreen;
}
// dance continues behind the level-clear card
const _step=step;
function stepWrap(){if(G.mode==='dancebg'){G.frame++;P.danceT++;updateParts();return}_step()}

/* ---------- simple test bot (used for automated playtesting only) ---------- */
function botInput(){
  const p=P,cF=Math.floor((p.x+p.w)/T),feetR=Math.floor((p.y+p.h-.01)/T);
  let j=false;
  for(let dc=0;dc<=1;dc++)for(let r=Math.floor(p.y/T);r<=feetR;r++)if(solidAt(cF+dc,r))j=true;
  let gap=true;for(let r=feetR+1;r<ROWS;r++)if(solidAt(cF+1,r)){gap=false;break}if(gap)j=true;
  return{j:true,je:j&&p.onGround};
}
/* ---------- boot ---------- */
function resize(){
  const r=canvas.getBoundingClientRect();if(!r.width)return;
  const dpr=window.devicePixelRatio||1;const nR=clamp(r.width*dpr/VW,1,3);
  if(Math.abs(nR-R)<.01&&cache[0])return;R=nR;canvas.width=Math.round(VW*R);canvas.height=Math.round(VH*R);buildCaches();
}
new ResizeObserver(resize).observe(canvas);
function start(){resize();titleScreen()}
function loop2(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  let n=0;while(acc>=1/FPS&&n<6){if(G.mode!=='pause')stepWrap();acc-=1/FPS;n++}
  if(G.fast){for(let i=0;i<G.fast;i++)if(G.mode!=='pause'&&G.mode!=='menu')stepWrap()}
  render();requestAnimationFrame(loop2);
}
const fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1500))]).then(()=>{start();buildCaches();requestAnimationFrame(loop2)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')togglePause()});
window.__sketchdash={G,get P(){return P},startLevel,loadLevel,LEVELS,get enemies(){return enemies},solidAt};
})();
