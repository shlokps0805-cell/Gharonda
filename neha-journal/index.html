  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Spotify iFrame API: loaded once. The ready callback is set first because the
         async script can finish before the app code runs; spotifyController.js picks it up. -->
    <script>
      window.onSpotifyIframeApiReady = function (api) {
        window.__spotifyIframeApi = api;
        window.dispatchEvent(new Event('spotify-api-ready'));
      };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  </body>
