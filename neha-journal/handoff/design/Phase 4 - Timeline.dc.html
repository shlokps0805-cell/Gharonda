<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=Pinyon+Script&display=swap"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#141E33;-webkit-font-smoothing:antialiased}a{color:#DCCBF3;text-decoration-color:#A57BD5;text-underline-offset:4px}a:hover{color:#FFFFFF}</style></helmet>
<section style="padding:96px;display:flex;flex-direction:column;gap:96px;background:#141E33;min-width:1984px">
<div style="display:flex;flex-direction:column;gap:16px;width:1840px">
<div style="font:700 12px/1 'Courier Prime',monospace;letter-spacing:.18em;color:#C4A8E6">NEHA · THE BIRTHDAY JOURNAL · PHASE 4A + 4B</div>
<div style="font:400 88px/1 'Libre Caslon Text',serif;color:#FFFFFF;white-space:nowrap">The timeline, <span style="font-style:italic">and five eras</span></div>
<div style="display:flex;flex-wrap:wrap;gap:22px;font:700 13px/1 'Courier Prime',monospace;letter-spacing:.06em"><sc-for list="{{ frames }}" as="n" hint-placeholder-count="9"><a href="#{{ n.id }}">{{ n.name }}</a></sc-for></div>
<div style="display:flex;gap:16px;padding-top:8px"><sc-for list="{{ audit }}" as="a" hint-placeholder-count="3"><div style="flex:1;padding:16px 20px;background:#FBF9F5;border-radius:4px;display:flex;flex-direction:column;gap:6px"><div style="font:700 11px/1 'Courier Prime',monospace;letter-spacing:.14em;color:#5E3695">{{ a.t }}</div><div style="font:400 14px/1.5 'DM Sans',sans-serif;color:#130F1F;text-wrap:pretty">{{ a.d }}</div></div></sc-for></div>
</div>
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="9">
<div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:baseline;gap:16px"><span style="font:700 14px/1 'Courier Prime',monospace;letter-spacing:.08em;color:#FFFFFF">{{ f.name }}</span><span style="font:400 13px/1 'Courier Prime',monospace;color:#ACBFD3">{{ f.sub }}</span></div>
<div style="display:flex;gap:40px;align-items:flex-start">
<dc-import name="TimelineScene" view="{{ f.v }}" layout="{{ f.l }}" count="{{ f.c }}" hint-size="1440px,900px"></dc-import>
<div style="width:360px;display:flex;flex-direction:column;gap:12px;padding:24px;background:#FBF9F5;border-radius:4px">
<div style="font:400 26px/1.15 'Libre Caslon Text',serif;color:#130F1F">{{ f.title }}</div>
<sc-for list="{{ f.notes }}" as="a" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid #E3E8EF"><div style="font:700 11px/1.3 'Courier Prime',monospace;letter-spacing:.06em;color:#204670">{{ a.t }}</div><div style="font:400 14px/1.5 'DM Sans',sans-serif;color:#130F1F;text-wrap:pretty">{{ a.d }}</div><div style="font:400 12px/1.4 'Courier Prime',monospace;color:#3D4A66">{{ a.m }}</div></div></sc-for>
</div>
</div>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const N = (t, d, m) => ({ t, d, m });
    const pull = N('PULL-OUT', 'A loose page (punched holes, its own paper, deeper shadow) slides out of the journal’s right edge over the spread, which softens behind it. Content scrolls inside the page; switcher and back stay put.', 'translateX 120% → 0 · 500ms · cubic-bezier(0.34,1.56,0.64,1) · spread veil 55% 300ms');
    const sw = N('SWITCHER + BACK', 'Year chips along the foot; the current era is filled navy. Another chip slides this page back in and the next one out. Back or Esc returns to the spread.', 'out 360ms ease-in · in 500ms spring');
    return {
      audit: [
        { t: 'AUDIT · LAYER 1 SPEC 5/5', d: 'Timeline spread with title, “pick a year”, five year buttons (year + Kalam name), pencil line, five clusters; era page with back, header, switcher, 10 and 8 photos, video tile, hover caption, enlarge in place; all five layouts. No lightbox anywhere.' },
        { t: 'AUDIT · LAYER 2 CRAFT 4/5 · FOUND → FIXED', d: 'Bunny sat on a year label → moved into the empty grid. Pencil line too faint → darker, wider dashes. Cluster photos are 240 px (min small); era page photos 240–620 px, so pages scroll inside. Gold clips/pins/corners only on photos; stickers flat.' },
        { t: 'AUDIT · LAYER 3 COHESION 4/5', d: 'Same desk, spiral and tabs; the pull-out page reuses the journal’s punched holes so it reads as torn from it. Each era differs in structure: taped scrapbook, polaroid scatter, feature grid, photobooth strips, felt pinboard. Render: 9 frames, 0 missing.' }
      ],
      frames: [
        { id: 'page', v: 'page', l: 'scrapbook', c: 10, name: '03-Timeline/Page', sub: 'the spread', title: 'then, now, always', notes: [N('YEAR BUTTONS', 'Paper labels: year in Courier Prime, era name in Kalam. Clicking one, or any photo, opens that era.', 'press: translateY 1px, 80ms'), N('TIMELINE', 'Five clusters along a pencil line across both pages, each a small stack (top photo 240 px, two prints peeking behind) with a year tag.', 'entrance: clusters drop in 70ms stagger · line draws 900ms'), N('STICKERS', '8 stuck stickers in margins and gaps.', '')] },
        { id: 'hover', v: 'page-hover', l: 'scrapbook', c: 10, name: '03-Timeline/Page-hover', sub: 'middle school hovered', title: 'Hover', notes: [N('BUTTON', 'Lifts 2px, lavender underline under the era name.', '150ms'), N('CLUSTER', 'Matching cluster lifts 4px; cursor becomes the zoom sticker.', '200ms spring')] },
        { id: 'scrap10', v: 'era', l: 'scrapbook', c: 10, name: '03-Timeline/Era-Scrapbook-10', sub: '4a · 10 photos · one is a video', title: 'Scrapbook page', notes: [pull, N('LAYOUT', 'Photos taped at angles with washi, torn edges, handwritten notes and arrows, a pressed lily. Third photo shows its hover: caption in Kalam + “taken by”.', 'photos drop on one by one 80ms stagger · tape sticks after · doodles draw 600ms'), N('VIDEO', 'Soft play button; plays in place.', 'click → inline video, 300ms crossfade'), sw] },
        { id: 'scrap8', v: 'era', l: 'scrapbook', c: 8, name: '03-Timeline/Era-Scrapbook-8', sub: '4a · the same layout with 8', title: 'Scrapbook, 8 photos', notes: [N('FEWER PHOTOS', 'The last row drops out; notes and stickers stay, the page simply ends sooner.', '')] },
        { id: 'enl', v: 'enlarged', l: 'scrapbook', c: 10, name: '03-Timeline/Photo-enlarged', sub: '4a · enlarge in place', title: 'Photo enlarged in place', notes: [N('ENLARGE', 'Click a photo: it grows 1.5× where it sits and comes to the front; the rest of the page dims. Click again or Esc returns it. No lightbox.', '350ms spring · dim 200ms')] },
        { id: 'pol', v: 'era', l: 'polaroid', c: 10, name: '03-Timeline/Era-Polaroid', sub: '4b · the middle-school years', title: 'Polaroid scatter', notes: [N('LAYOUT', 'Large polaroids scattered and slightly overlapping, captions handwritten on the strip, a few held by gold clips.', 'slide in from the page edges, land with a small bounce · 450ms spring · 60ms stagger')] },
        { id: 'feat', v: 'era', l: 'feature', c: 10, name: '03-Timeline/Era-Feature', sub: '4b · the trip', title: 'Feature page', notes: [N('LAYOUT', 'One hero photo filling the left half, a pull-quote in Libre Caslon, a neat grid of smaller photos with white borders and gold photo corners.', 'hero fades up 400ms · grid ripples in 50ms stagger')] },
        { id: 'booth', v: 'era', l: 'booth', c: 10, name: '03-Timeline/Era-Photobooth', sub: '4b · last year', title: 'Photobooth wall', notes: [N('LAYOUT', 'Three 4-frame strips at varied heights, each with a gold clip, plus single prints.', 'strips slide down as if printing · 700ms ease-out · 150ms stagger')] },
        { id: 'pin', v: 'era', l: 'pinboard', c: 10, name: '03-Timeline/Era-Pinboard', sub: '4b · now', title: 'Pinboard', notes: [N('LAYOUT', 'The page becomes a soft dusty-blue felt board; photos pinned with gold pins and joined with thin dusty-rose string, plus handwritten notes.', 'pins pop in 120ms each · string draws between them 400ms')] }
      ]
    };
  }
}
</script>
</body>
</html>
