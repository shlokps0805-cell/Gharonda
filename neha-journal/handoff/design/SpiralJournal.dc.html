<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>*,*::before,*::after{box-sizing:border-box}</style></helmet>
<div style="position:relative;flex:none;width:{{ ow }}px;height:{{ oh }}px">
<sc-if value="{{ edges }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ stack }}" as="e" hint-placeholder-count="4">
<div style="position:absolute;left:{{ e.x }}px;top:{{ e.y }}px;width:{{ w }}px;height:{{ h }}px;border-radius:3px 8px 8px 3px;background:{{ e.c }};box-shadow:0 1px 2px rgba(19,15,31,.18)"></div>
</sc-for>
</sc-if>
<div style="position:absolute;left:0;top:0;width:{{ w }}px;height:{{ h }}px;border-radius:3px 8px 8px 3px;background:{{ paperBg }};box-shadow:0 2px 3px rgba(19,15,31,.22),0 18px 40px rgba(19,15,31,.28);overflow:hidden">
<div style="position:absolute;inset:0;background:url({{ tex }}) 0 0/{{ texS }};opacity:{{ texO }};mix-blend-mode:{{ texBlend }}"></div>
<sc-if value="{{ lined }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;top:96px;bottom:24px;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(142,167,201,.45) 31px 32px)"></div>
<div style="position:absolute;top:0;bottom:0;left:112px;width:1.5px;background:rgba(201,90,91,.45)"></div>
</sc-if>
<sc-if value="{{ grid }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:24px 24px 24px 64px;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(142,167,201,.32) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(142,167,201,.32) 23px 24px)"></div>
</sc-if>
<div style="position:absolute;top:0;bottom:0;left:0;width:72px;background:linear-gradient(90deg,{{ gutter }},rgba(19,15,31,0))"></div>
<sc-if value="{{ cover }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:14px 14px 14px 52px;border:1px solid rgba(255,255,255,.2);border-radius:4px"></div>
</sc-if>
<sc-if value="{{ leak }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(196,168,230,.32),rgba(196,168,230,0) 70%)"></div></sc-if>
<sc-for list="{{ holes }}" as="y" hint-placeholder-count="20">
<div style="position:absolute;left:20px;top:{{ y }}px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:{{ holeBg }};box-shadow:inset 0 1.5px 2px rgba(0,0,0,.45)"></div>
</sc-for>
</div>
<sc-for list="{{ holes }}" as="y" hint-placeholder-count="20">
<div style="position:absolute;left:-16px;top:{{ y }}px;width:44px;height:11px;margin-top:-8px;border-radius:6px;background:{{ coil }};transform:rotate(-9deg);box-shadow:{{ coilSh }}"></div>
</sc-for>
<sc-if value="{{ ribbon }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:{{ ribX }}px;top:{{ ribY }}px;width:20px;height:{{ ribL }}px;background:linear-gradient(90deg,#9E2617,#BA2F1F 40%,#C8402F 60%,#9E2617);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);box-shadow:1px 2px 3px rgba(19,15,31,.3)"></div>
</sc-if>
<sc-if value="{{ elastic }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:{{ elX }}px;top:-6px;width:14px;height:{{ elH }}px;border-radius:3px;background:repeating-linear-gradient(180deg,#5E3695 0 2px,#4A2880 2px 4px);box-shadow:inset 2px 0 0 rgba(255,255,255,.16),2px 0 4px rgba(19,15,31,.35)"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:900},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1200,&quot;min&quot;:200,&quot;max&quot;:1400,&quot;tsType&quot;:&quot;number&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:800,&quot;min&quot;:140,&quot;max&quot;:1000,&quot;tsType&quot;:&quot;number&quot;},&quot;paper&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;white&quot;,&quot;options&quot;:[&quot;white&quot;,&quot;lined&quot;,&quot;grid&quot;,&quot;kraft&quot;,&quot;dark&quot;,&quot;lavender&quot;,&quot;powder&quot;,&quot;cover-navy&quot;,&quot;cover-brown&quot;,&quot;cover-violet&quot;,&quot;tint&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EEE7F8&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;coil&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;silver&quot;,&quot;options&quot;:[&quot;silver&quot;,&quot;purple&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;edges&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ribbon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;elastic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;leak&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loops&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:6,&quot;max&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;holeColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2A2235&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1200), h = Number(this.props.h ?? 800);
    const paper = this.props.paper ?? 'white';
    const coilK = this.props.coil ?? 'silver';
    const edges = this.props.edges ?? true;
    const n = this.props.loops ?? Math.max(8, Math.min(22, Math.round(h / 38)));
    const holes = []; const top = 36, bot = h - 36; for (let i = 0; i < n; i++) holes.push(Math.round(top + (bot - top) * i / (n - 1)));
    const P = {
      white: ['#FFFFFF', 'assets/tex/grain.png', '128px 128px', 1, 'normal'],
      lined: ['#FFFFFF', 'assets/tex/grain.png', '128px 128px', 1, 'normal'],
      grid: ['#FFFFFF', 'assets/tex/grain.png', '128px 128px', 1, 'normal'],
      kraft: ['#CDB79A', 'assets/tex/kraft.png', '256px 256px', 1, 'normal'],
      dark: ['#1C1828', 'assets/tex/film-grain.png', '200px 200px', 1, 'normal'],
      lavender: ['#EEE7F8', 'assets/tex/grain.png', '128px 128px', 1, 'normal'],
      powder: ['#E6EDF4', 'assets/tex/grain.png', '128px 128px', 1, 'normal'],
      'cover-navy': ['#204670', 'assets/tex/linen-navy.png', '160px 160px', 1, 'normal'],
      'cover-brown': ['#6B4A33', 'assets/tex/leather-brown.png', '200px 200px', 1, 'normal'],
      'cover-violet': ['#3B2266', 'assets/tex/linen-violet.png', '160px 160px', 1, 'normal'],
      tint: [this.props.tint ?? '#EEE7F8', 'assets/tex/grain.png', '128px 128px', 1, 'normal']
    };
    const p = P[paper] || P.white;
    const darkish = ['dark', 'cover-navy', 'cover-violet', 'cover-brown'].includes(paper);
    const silver = 'linear-gradient(180deg,#F4F5F8 0%,#B4BAC6 30%,#7D8492 52%,#C9CED8 72%,#8E95A3 100%)';
    const purple = 'linear-gradient(180deg,#EBE0F8 0%,#C4A8E6 32%,#9277BF 55%,#D6C3EF 76%,#A57BD5 100%)';
    const stackC = paper === 'kraft' ? ['#BFA889', '#C9B394', '#B39C7E', '#C4AE8F'] : ['#ECE8E1', '#F4F1EC', '#E3DED6', '#EFEBE5'];
    const stack = edges ? [4, 3, 2, 1].map(i => ({ x: i * 3, y: i * 3, c: stackC[i - 1] })) : [];
    return {
      w, h, ow: w + (edges ? 12 : 0), oh: h + (edges ? 12 : 0) + ((this.props.ribbon ?? false) ? 56 : 0), edges, stack,
      paperBg: p[0], tex: p[1], texS: p[2], texO: p[3], texBlend: p[4],
      lined: paper === 'lined', grid: paper === 'grid', cover: paper.startsWith('cover'),
      gutter: darkish ? 'rgba(0,0,0,.35)' : 'rgba(19,15,31,.09)',
      leak: !!this.props.leak,
      holes, holeBg: this.props.holeColor ?? '#2A2235',
      coil: coilK === 'purple' ? purple : silver,
      coilSh: '0 3px 2px rgba(19,15,31,.32)',
      ribbon: this.props.ribbon ?? false, ribX: Math.round(w * .74), ribY: h - 30, ribL: 86,
      elastic: !!this.props.elastic, elX: w - 64, elH: h + 12
    };
  }
}
</script>
</body>
</html>
