<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>*,*::before,*::after{box-sizing:border-box}@keyframes nh-spin{to{transform:rotate(360deg)}}@keyframes nh-ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}</style></helmet>
<div style="position:relative;flex:none;width:280px;height:80px">
<sc-if value="{{ press }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:96px;bottom:84px;display:flex;align-items:flex-end;gap:6px;pointer-events:none">
<div style="font:600 26px/1 'Caveat',cursive;color:{{ noteColor }};transform:rotate(-3deg);white-space:nowrap">tap to start the music</div>
<div style="width:18px;height:26px;border-right:2px solid {{ noteColor }};border-bottom:2px solid {{ noteColor }};border-bottom-right-radius:18px;transform:rotate(18deg) translateY(10px)"></div>
</div>
</sc-if>
<div style="position:absolute;inset:0;background:#141E33;border-radius:12px;border:1px solid rgba(255,255,255,.1);box-shadow:0 2px 4px rgba(0,0,0,.35),0 10px 20px rgba(0,0,0,.25);padding:12px;display:flex;align-items:center;gap:12px">
<div style="position:relative;flex:none;width:52px;height:36px;border-radius:5px;background:#130F1F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)">
<div style="position:absolute;left:4px;top:4px;width:44px;height:19px;border-radius:2px;background:#DCCBF3"></div>
<div style="position:absolute;left:11px;top:9px;width:30px;height:11px;border-radius:6px;background:#130F1F"></div>
<div style="position:absolute;left:13px;top:10px;width:9px;height:9px;border-radius:50%;background:repeating-conic-gradient(#130F1F 0 18deg,#FFFFFF 18deg 60deg);animation:{{ spin }}"></div>
<div style="position:absolute;left:30px;top:10px;width:9px;height:9px;border-radius:50%;background:repeating-conic-gradient(#130F1F 0 18deg,#FFFFFF 18deg 60deg);animation:{{ spin }}"></div>
<div style="position:absolute;left:15px;top:27px;width:22px;height:6px;background:#2E3B5E;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)"></div>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:8px">
<div style="flex:1;min-width:0;font:600 14px/1.2 'DM Sans',sans-serif;color:{{ titleColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</div>
<div style="position:relative;flex:none;width:20px;height:20px;cursor:pointer" onClick="{{ toggleMute }}">
<div style="position:absolute;left:2px;top:7px;width:4px;height:6px;background:#FFFFFF"></div>
<div style="position:absolute;left:5px;top:3px;width:6px;height:14px;background:#FFFFFF;clip-path:polygon(0 30%,100% 0,100% 100%,0 70%)"></div>
<sc-if value="{{ soundOn }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:9px;top:6px;width:6px;height:8px;border-right:2px solid #FFFFFF;border-radius:0 50% 50% 0"></div>
<div style="position:absolute;left:10px;top:3px;width:9px;height:14px;border-right:2px solid #FFFFFF;border-radius:0 50% 50% 0"></div>
</sc-if>
<sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:12px;top:9px;width:8px;height:2px;background:#FFFFFF;transform:rotate(45deg)"></div>
<div style="position:absolute;left:12px;top:9px;width:8px;height:2px;background:#FFFFFF;transform:rotate(-45deg)"></div>
</sc-if>
</div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<div style="flex:1;min-width:0;font:400 12px/1.2 'DM Sans',sans-serif;color:#ACBFD3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ picked }}</div>
<div style="display:flex;align-items:center;gap:6px">
<div style="display:flex;align-items:center;width:18px;height:22px;justify-content:center;cursor:pointer"><div style="width:2px;height:10px;background:#FFFFFF"></div><div style="width:8px;height:10px;background:#FFFFFF;clip-path:polygon(100% 0,0 50%,100% 100%)"></div></div>
<div style="position:relative;width:28px;height:28px;cursor:pointer" onClick="{{ togglePlay }}">
<sc-if value="{{ press }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:-3px;border-radius:50%;border:2px solid #C4A8E6;animation:nh-ring 1400ms cubic-bezier(0.25,1,0.5,1) infinite"></div><div style="position:absolute;inset:-3px;border-radius:50%;border:2px solid #C4A8E6"></div></sc-if>
<div style="position:absolute;inset:0;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:3px">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><div style="width:3px;height:11px;background:#130F1F"></div><div style="width:3px;height:11px;background:#130F1F"></div></sc-if>
<sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}"><div style="width:10px;height:12px;margin-left:2px;background:#130F1F;clip-path:polygon(0 0,100% 50%,0 100%)"></div></sc-if>
</div>
</div>
<div style="display:flex;align-items:center;width:18px;height:22px;justify-content:center;cursor:pointer"><div style="width:8px;height:10px;background:#FFFFFF;clip-path:polygon(0 0,100% 50%,0 100%)"></div><div style="width:2px;height:10px;background:#FFFFFF"></div></div>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:160},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;paused&quot;,&quot;options&quot;:[&quot;paused&quot;,&quot;playing&quot;,&quot;press&quot;,&quot;muted&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Song title · Artist&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;picked&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;picked by Friend 3&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  static SONGS = Array.from({ length: 15 }, (_, i) => ({ t: `Song ${String(i + 1).padStart(2, '0')} · Artist`, p: `picked by Friend ${(i * 7) % 12 + 1}` }));
  state = { st: null, mute: null, pick: Math.floor(Math.random() * 15) };
  componentDidUpdate(prev) { if (prev.state !== this.props.state) this.setState({ st: null, mute: null }); }
  renderVals() {
    const st = this.state.st ?? this.props.state ?? 'paused';
    const muted = this.state.mute ?? (st === 'muted');
    const playing = st === 'playing' || (st === 'muted' && this.state.st === null && this.props.state === 'muted');
    return {
      title: this.props.title ?? Component.SONGS[this.state.pick].t,
      picked: this.props.picked ?? Component.SONGS[this.state.pick].p,
      playing, notPlaying: !playing, press: st === 'press', muted, soundOn: !muted,
      titleColor: muted ? '#ACBFD3' : '#FFFFFF', noteColor: this.props.noteColor ?? '#204670',
      spin: playing ? 'nh-spin 2.4s linear infinite' : 'none',
      togglePlay: () => this.setState({ st: playing ? 'paused' : 'playing' }),
      toggleMute: () => this.setState({ mute: !muted })
    };
  }
}
</script>
</body>
</html>
