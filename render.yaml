# Render blueprint for the Neha birthday journal (a static site in neha-journal/).
# On render.com: New + > Blueprint > pick this repository > Apply.
services:
  - type: web
    name: neha-journal
    runtime: static
    rootDir: neha-journal
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      # built code gets a new file name whenever it changes, so it can be cached for a year
      # (photos are not cached long: their links change with every build instead)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # the page itself is always fetched fresh, so updates show up straight away
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      # keep the journal out of search engines
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
